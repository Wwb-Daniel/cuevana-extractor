name: Sincronizar Saga Avengers a CinemaDB

on:
  workflow_dispatch:
    inputs:
      movie_index:
        description: 'Índice de la película (0: Los Vengadores, 1: Era de Ultrón, 2: Infinity War, 3: Endgame, o "all" para toda la saga)'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  sync-avengers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias de Node
        run: npm ci || npm install

      - name: Instalar herramientas multimedia (ffmpeg, yt-dlp)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp --version

      - name: Ejecutar Sincronización de Avengers
        env:
          R2_ACCESS_KEY_ID: 'fe39bf665d06666923f48b5763240c4f'
          R2_SECRET_ACCESS_KEY: '8a1e2ff8f0305ce224ef7e8cbb82f4bda97103ffd6a35d99ec7f2ad8853cf7ba'
          SUPABASE_PREMIUM_URL: ${{ secrets.SUPABASE_PREMIUM_URL }}
          SUPABASE_PREMIUM_ANON_KEY: ${{ secrets.SUPABASE_PREMIUM_ANON_KEY }}
        run: |
          if [ "${{ github.event.inputs.movie_index }}" != "all" ]; then
            node sync_avengers.js --index "${{ github.event.inputs.movie_index }}"
          else
            node sync_avengers.js
          fi
